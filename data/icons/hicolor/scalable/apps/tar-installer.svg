<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Package Base Shape -->
  <path d="M128 54 L196 90 L128 126 L60 90 Z" fill="#93c5fd" opacity="0.9" />
  <path d="M60 90 L128 126 L128 202 L60 166 Z" fill="#60a5fa" opacity="0.95" />
  <path d="M196 90 L128 126 L128 202 L196 166 Z" fill="#3b82f6" />

  <!-- Unpacking / Download Arrow Overlay -->
  <circle cx="128" cy="128" r="46" fill="#ffffff" filter="url(#shadow)" />
  <circle cx="128" cy="128" r="40" fill="url(#accentGrad)" />

  <!-- Arrow Icon pointing into package -->
  <path d="M128 104 L128 142 M112 128 L128 144 L144 128" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Tar Tape Detail -->
  <rect x="118" y="148" width="20" height="6" rx="3" fill="#ffffff" opacity="0.9" />
</svg>
